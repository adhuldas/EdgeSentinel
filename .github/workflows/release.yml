name: Release

on:
  push:
    branches: [main]
    paths: ["VERSION"]
    tags:
      - "v*.*.*"

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # --locked asserts uv.lock is already up to date with pyproject.toml
        # and fails instead of silently re-resolving -- a release must never
        # publish against dependencies nobody reviewed. Only the `dev` extra
        # is installed, not `mqtt`: some tests assert behavior when the
        # optional `paho-mqtt` dependency is absent (see
        # tests/integrations/test_mqtt.py), so `--all-extras` would break them.
        run: uv sync --python ${{ matrix.python-version }} --extra dev --locked

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

      - name: Ruff check
        if: matrix.python-version == '3.13'
        run: uv run ruff check .

      - name: Ruff format check
        if: matrix.python-version == '3.13'
        run: uv run ruff format --check .

      - name: Mypy
        if: matrix.python-version == '3.13'
        run: uv run mypy src tests

  tag:
    name: verify / create release tag
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write # required to push the tag when triggered by a VERSION bump
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.verify_tag.outputs.should_release || steps.create_tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and existing-tag status
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches VERSION file
        id: verify_tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION file (${{ steps.version.outputs.version }})"
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        id: create_tag
        if: github.ref == 'refs/heads/main' && steps.version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Skip (VERSION unchanged / tag already released)
        if: github.ref == 'refs/heads/main' && steps.version.outputs.exists == 'true'
        run: |
          echo "::notice::v${{ steps.version.outputs.version }} already tagged/released; skipping publish."
          echo "should_release=false" >> "$GITHUB_OUTPUT"

  build:
    name: build distributions
    runs-on: ubuntu-latest
    needs: tag
    if: needs.tag.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/edgesentinel/
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # VERSION is the single source of truth for the release version;
          # if this version is already published (e.g. the workflow was
          # re-run, or a tag was pushed for a version already on PyPI),
          # skip the upload instead of failing the release.
          skip-existing: true

  github-release:
    name: create GitHub release
    runs-on: ubuntu-latest
    needs: [tag, publish-pypi]
    permissions:
      contents: write # required to create the GitHub release
    steps:
      - uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract CHANGELOG section for this version
        id: changelog
        run: |
          VERSION="${{ needs.tag.outputs.version }}"
          NOTES_FILE="$(mktemp)"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::no CHANGELOG.md section found for [$VERSION]"
            exit 1
          fi
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          name: edgesentinel v${{ needs.tag.outputs.version }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          files: dist/*
